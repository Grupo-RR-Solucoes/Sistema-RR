# ============================================================================
# Gates de regressao - MODO AVISO.
#
# Roda em todo pull_request para a main. O resultado aparece como check no PR
# (verde/vermelho), mas NAO bloqueia o merge: nao ha required status check nem
# branch protection configurados. Bloquear e decisao futura, quando os 3 gates
# estiverem fixturizados - hoje so 1 dos 3 roda aqui, e travar o merge daria
# falsa cobertura (parece 3, roda 1).
#
# SEM SECRETS, POR DESENHO: este workflow so executa `npm run gates`, que roda
# exclusivamente os gates SELF-CONTAINED (ver scripts/run_all_gates.cjs). Os
# gates que leem o banco sao PULADOS pelo proprio runner. Se algum dia um gate
# de banco entrar aqui, ele vai falhar com exit 3 em vez de silenciosamente
# passar - e o sinal de que a classificacao no runner esta errada, nao um
# convite para adicionar a service role de producao como secret.
#
# ============================================================================
# GATE DE SCHEMA — O UNICO PASSO QUE FALA COM O BANCO VIVO, E POR QUE
# ============================================================================
# O paragrafo acima continua valendo para `npm run gates`: aquele passo roda so
# os self-contained e NAO toca banco. O passo "Gate de schema" e a excecao
# DELIBERADA, e a razao e que a pergunta dele nao tem resposta dentro do repo.
#
# A PERGUNTA: "a coluna que o codigo faz SELECT/UPSERT existe ONDE ELE VAI LER?"
# Isso e estado do BANCO, nao do repositorio. Conferir contra supabase/migrations/
# responderia outra pergunta ("alguem escreveu o DDL?") e teria passado VERDE no
# incidente de 21/08/2026 (PR #174): o DDL de piso_zerou foi mergeado em
# scripts/sql/, fora de migrations, e 6 telas cairam com 42703 mais o fechamento
# e a reconsolidacao junto. Passaria verde tambem no caso inverso, medido na
# mesma varredura: a migration 20260712_000002 de bbts_rule_uploads existe e
# nunca foi aplicada. As duas falhas divergem no repo e convergem no banco.
#
# POR QUE A CHAVE ANON BASTA — E POR QUE ISSO NAO E BRECHA. Medido em 21/08/2026
# contra este projeto:
#   coluna INEXISTENTE  -> 42703 "column ... does not exist"
#   coluna que EXISTE   -> 42501 "permission denied for table ..."
# O PostgREST resolve NOME DE COLUNA antes de aplicar permissao, entao o 42703
# aparece mesmo sem grant nenhum — inclusive misturando coluna existente e
# inexistente na MESMA consulta, nas duas ordens (testado). A anon deste projeto
# nao tem grant em NENHUMA das 62 tabelas: ela nunca le uma linha de dado. O gate
# so consegue perguntar "este nome resolve?", que e exatamente o que ele precisa.
#
# A SERVICE_ROLE NAO ENTRA AQUI, NEM COMO SECRET. Ela ignora RLS; um runner
# publico com ela vira porta de entrada para o banco inteiro. A anon e
# `sb_publishable_`, ja viaja no bundle do browser e nao amplia superficie
# nenhuma ao ser exposta como repository VARIABLE (nao secret).
#
# O QUE MUDA COM A ANON (nao ha paridade total, e o gate diz isso na saida): a
# raiz OpenAPI do PostgREST exige chave secreta (401 com a anon), entao o
# caminho de 1 requisicao nao existe aqui — a anon sonda tabela por tabela, 62
# requisicoes, ~10,7s medidos. E o gate perde a LISTA do que existe, entao nao
# sugere "voce quis dizer X?". O VEREDITO falta/nao-falta e identico: verificado
# por diff das duas saidas, byte a byte.
#
# SE ESTE PASSO FALHAR COM "ABORTADO — SEM CREDENCIAL": as repository variables
# NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY nao chegaram. Elas
# nao existem em PR vindo de fork (por desenho do GitHub). O gate ABORTA em vez
# de passar, porque ausencia de medicao nao e aprovacao.
#
# NAO CONFLITA COM O VERCEL: o Vercel dispara no push/deploy e faz o build;
# este workflow dispara no pull_request e nao builda nem publica nada. Sao dois
# checks independentes no mesmo PR.
# ============================================================================

name: gates

on:
  pull_request:
    branches: [main]

# Cancela execucoes antigas do mesmo PR quando chega commit novo.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Gates de regressao (self-contained)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # HISTORICO COMPLETO, E ISSO E UMA ASSERCAO, NAO UMA PREFERENCIA.
          #
          # O padrao do checkout e fetch-depth: 1, que traz so o commit do
          # merge do PR e NAO cria refs/remotes/origin/main. O G5 de
          # scripts/gate_teto_avista_rr.ts compara `origin/main...HEAD` para
          # provar que lib/motor.ts e lib/promotivaCashPolicy.ts nao foram
          # tocados na branch — com profundidade 1 essa ref nao resolve, o git
          # falha, e ate 18/08/2026 o gate ENGOLIA o erro e imprimia
          # "GATE PASSOU". A assercao estava desligada em silencio desde sempre,
          # exatamente no unico lugar onde ela deveria guardar.
          #
          # Os dois lados foram consertados juntos: o gate agora REPROVA quando
          # a ref nao resolve (ausencia de medicao nao e aprovacao), e aqui a
          # ref passa a existir. Baixar isto de volta para 1 nao "acelera o CI":
          # devolve o gate ao estado de verde por vacuidade, agora com o efeito
          # colateral de reprovar — o que e ruidoso, e de proposito.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # ---------------------------------------------------------------------
      # TIPAGEM DOS GATES — projeto SEPARADO, e por isso precisa de passo proprio
      # ---------------------------------------------------------------------
      # O passo acima roda o tsconfig.json principal, que EXCLUI scripts/ (decisao
      # de 27/06/2026, para o next build do Vercel nao compilar os diag-* de
      # scratch). Consequencia: ate 21/08/2026 a tipagem dos gates so era exercida
      # por quem rodasse `npm run typecheck:gates` a mao — e ninguem rodava.
      #
      # O QUE ISSO CUSTOU, medido: scripts/gate-medida-c-rota.mts estava com
      # TS2353 em origin/main. A API de resolverJanela mudou em 03/08 (`dia` ->
      # `n`, dia-do-mes -> posicao na janela) e o gate ficou para tras. Gate que
      # nao compila e gate MORTO, e morto reporta verde por AUSENCIA de falha —
      # foi assim que o gate_projecao_gestor morreu antes dele.
      #
      # O runner ja cobra que todo gate rastreado esteja no include do
      # tsconfig.gates.json (bloco COBERTURA DA TIPAGEM em run_all_gates.cjs).
      # Faltava o outro lado: alguem COMPILAR o que esta no include. E este passo.
      #
      # Self-contained: tsc sobre arquivo do repo, sem banco e sem secret.
      - name: Typecheck dos gates
        run: npm run typecheck:gates

      - name: Gates
        run: npm run gates

      # ---------------------------------------------------------------------
      # UNICO PASSO QUE FALA COM O BANCO VIVO. Ver o bloco "GATE DE SCHEMA" no
      # cabecalho deste arquivo antes de mexer.
      # ---------------------------------------------------------------------
      # --anon e EXPLICITO, nao decorativo. O gate ja escolheria a anon sozinho
      # aqui (nao existe SUPABASE_SERVICE_ROLE_KEY neste ambiente), mas a flag
      # trava a escolha: se um dia alguem adicionar a service_role como secret
      # do repositorio, este passo continua usando a anon em vez de silenciosa-
      # mente promover o CI a cliente privilegiado do banco de producao.
      #
      # SEM continue-on-error e SEM `|| true`: gate que reprova tem de deixar o
      # check VERMELHO. Se este passo comecar a incomodar, a resposta e rodar o
      # DDL que falta, nao afrouxar o passo.
      - name: Gate de schema (coluna pedida pelo codigo existe no banco?)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx tsx scripts/gate_schema_colunas.mts --anon
